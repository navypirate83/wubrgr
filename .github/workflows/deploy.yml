# =====================================================================
# PUBLISHING THE SITE TO GITHUB PAGES
# Every time new code reaches the "main" branch on GitHub, GitHub runs
# these steps on one of its own computers: it builds the finished site
# ("npm run build", which makes the "dist" folder) and publishes it at
# https://wubrgr.navypirate83.com/ (its own address, set as the "custom domain" in the
# repository's Settings → Pages; the old navypirate83.com/wubrgr/ forwards to it)
# It also runs once a day on its own, so the card prices stay fresh.
# (It can also be started by hand, from the repository's "Actions" tab.)
# =====================================================================

name: Publish to GitHub Pages

# When to run: on every push to main, once a day (the stores update their
# prices overnight), or when started by hand
on:
  push:
    branches: [main]
  schedule:
    - cron: '30 21 * * *'   # 21:30 UTC every day
  workflow_dispatch:

# What these steps are allowed to do: read the code, and publish to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one publish at a time: a newer push waits for the one running
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Step 1: build the site
  build:
    runs-on: ubuntu-latest
    steps:
      # Get a copy of the code
      - uses: actions/checkout@v7
      # Install Node.js 26 (the newest long-term version), remembering
      # downloaded packages between runs to save time
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      # Install the exact packages listed in package-lock.json
      - run: npm ci
      # Check the code and build the finished site into "dist"
      # (The website talks to the WUBRG'r server at this address. It is set
      # as a "variable" in the repository's Settings → Secrets and variables
      # → Actions → Variables, named API_URL.)
      - run: npm run build
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.API_URL }}
      # Put the card scanner's catalogue into the site. It's two files kept in the
      # repository's "catalogue" release (built by scripts/catalogue/build-catalogue.mjs
      # and uploaded with "gh release upload catalogue ... --clobber"), copied into
      # dist/catalogue so the app downloads them from the site itself. (No catalogue
      # release yet: the site is published without one.)
      - name: Add the card catalogue to the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/catalogue
          gh release download catalogue --repo "${{ github.repository }}" --dir dist/catalogue --pattern 'catalogue.json' --pattern 'catalogue.db.gz' || echo "No catalogue release yet"
      # THE CARD PRICES (see scripts/prices/build-prices.mjs). Yesterday's files are
      # fetched back first, so if a store can't be reached today the old prices stay.
      - uses: actions/cache@v5
        with:
          path: price-files
          key: prices-${{ github.run_id }}
          restore-keys: prices-
      - name: Build today's card prices
        run: |
          node scripts/prices/build-prices.mjs price-new && rm -rf price-files && mv price-new price-files || echo "::warning::Today's prices couldn't be built; keeping the last ones"
          if [ -d price-files ]; then cp -r price-files dist/prices; fi
      # Get GitHub Pages ready, then hand it the "dist" folder
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Step 2: publish what was built (only once the build worked)
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
